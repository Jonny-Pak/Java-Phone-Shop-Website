<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
</head>
<body>
  <h1>Đăng ký</h1>
  <div th:if="${error}" style="color:red;" th:text="${error}"></div>
  <div th:if="${success}" style="color:green;" th:text="${success}"></div>

  <form th:action="@{/register}" method="post" th:object="${user}">
    <label>Họ và tên: <input type="text" th:field="*{fullName}" /></label><br/>
    <label>Email: <input type="email" th:field="*{email}" /></label><br/>
    <label>Mật khẩu: <input type="password" th:field="*{password}" /></label><br/>
    <button type="submit">Đăng ký</button>
  </form>
  <p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</body>
</html>
